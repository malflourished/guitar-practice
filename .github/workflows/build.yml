name: Build Vibrato

on:
  push:
    branches: [main, 'codex/**', vibrato-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package macOS
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run app:build
      - name: Archive the Mac app with executable permissions and symlinks
        run: ditto -c -k --sequesterRsrc --keepParent 'release/mac-arm64/vibrato~.app' release/Vibrato-macOS-AppleSilicon.zip
      - name: Upload Mac build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vibrato-macOS-AppleSilicon
          path: release/Vibrato-macOS-AppleSilicon.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vibrato-web
          path: dist/
          if-no-files-found: error
          retention-days: 30
